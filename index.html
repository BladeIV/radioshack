<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Radio Shack - spin the globe and listen to live radio stations from around the world.">
<title>Radio Shack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a0f;
  --bg-glow:#0f1b2a;
  --surface:rgba(16,22,32,.82);
  --surface-solid:#101620;
  --surface-hover:#172131;
  --border:#223044;
  --text:#e8eef5;
  --muted:#8a99ad;
  --accent:#34d3b4;
  --accent-strong:#5eead4;
  --accent-ink:#04201b;
  --highlight:#f5b84a;
  --danger:#f87171;
  --radius:14px;
  --shadow:0 12px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:radial-gradient(ellipse at 50% 40%,var(--bg-glow) 0%,var(--bg) 65%);
  color:var(--text);
  font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#globe{position:fixed;inset:0}

.brand{
  position:fixed;top:16px;left:16px;z-index:5;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border);
  backdrop-filter:blur(14px);box-shadow:var(--shadow);
}
.brand svg{flex:none}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}

.crosshair{
  position:fixed;left:50%;top:50%;z-index:2;pointer-events:none;
  width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  border:1.5px solid rgba(232,238,245,.55);
  box-shadow:0 0 0 4px rgba(0,0,0,.25);
}

.panel{
  position:fixed;z-index:5;top:16px;right:16px;bottom:104px;width:360px;
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  backdrop-filter:blur(14px);box-shadow:var(--shadow);overflow:hidden;
}
.search{position:relative;padding:14px 14px 10px}
.search svg{position:absolute;left:26px;top:50%;transform:translateY(-35%);color:var(--muted)}
.search input{
  width:100%;height:42px;padding:0 12px 0 38px;border-radius:10px;
  background:var(--surface-solid);border:1px solid var(--border);outline:none;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--accent)}

.tabs{display:flex;gap:4px;padding:0 14px 10px}
.tab{
  flex:1;height:34px;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--muted);font-weight:600;font-size:13px;
}
.tab:hover{color:var(--text);background:var(--surface-hover)}
.tab[aria-selected="true"]{color:var(--text);background:var(--surface-solid);border-color:var(--border)}

.list-head{padding:4px 18px 8px;border-bottom:1px solid var(--border)}
.list-head h2{margin:0;font-size:15px;font-weight:600}
.list-head p{margin:2px 0 0;color:var(--muted);font-size:12px}

.list{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1}
.list::-webkit-scrollbar{width:8px}
.list::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.station{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:9px 10px;border:0;border-radius:10px;background:transparent;text-align:left;
}
.station:hover{background:var(--surface-hover)}
.station.playing{background:rgba(52,211,180,.1)}
.station.playing .st-name{color:var(--accent-strong)}
.logo{
  flex:none;width:38px;height:38px;border-radius:8px;overflow:hidden;
  display:grid;place-items:center;background:var(--surface-solid);border:1px solid var(--border);
  color:var(--muted);font-weight:700;font-size:13px;
}
.logo img{width:100%;height:100%;object-fit:cover;background:#fff}
.st-text{min-width:0;flex:1}
.st-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section{padding:16px 10px 6px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.empty{padding:28px 18px;color:var(--muted);text-align:center}

.player{
  position:fixed;z-index:6;left:16px;right:16px;bottom:16px;height:72px;
  display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  backdrop-filter:blur(14px);box-shadow:var(--shadow);
}
.play{
  flex:none;width:46px;height:46px;border-radius:50%;border:0;
  display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);
  transition:transform .15s ease,background .15s ease;
}
.play:hover{background:var(--accent-strong);transform:scale(1.05)}
.play:disabled{background:var(--border);color:var(--muted);cursor:default;transform:none}
.now{min-width:0;flex:1}
.now-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-meta{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.live{display:none;align-items:center;gap:5px;color:var(--accent);font-weight:700;font-size:11px;letter-spacing:.06em}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
.is-live .live{display:inline-flex}
@keyframes pulse{50%{opacity:.3}}
.icon-btn{
  flex:none;width:40px;height:40px;border-radius:10px;border:1px solid transparent;
  display:grid;place-items:center;background:transparent;color:var(--muted);
}
.icon-btn:hover{color:var(--text);background:var(--surface-hover)}
.icon-btn[aria-pressed="true"]{color:var(--highlight)}
.icon-btn[aria-pressed="true"] svg{fill:currentColor}
.volume{display:flex;align-items:center;gap:8px;color:var(--muted)}
.volume input{width:110px;accent-color:var(--accent)}

.tip{
  padding:6px 10px;border-radius:8px;background:var(--surface-solid);border:1px solid var(--border);
  font:12px/1.4 Inter,system-ui,sans-serif;color:var(--text);
}
.tip span{color:var(--muted)}

.toast{
  position:fixed;z-index:10;left:50%;bottom:104px;transform:translate(-50%,20px);
  padding:10px 16px;border-radius:10px;background:var(--surface-solid);border:1px solid var(--border);
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s ease;max-width:calc(100vw - 32px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.loading{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:var(--bg);transition:opacity .4s ease;
}
.loading.done{opacity:0;pointer-events:none}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{margin:0;color:var(--muted);text-align:center}

.credit{position:fixed;z-index:4;left:16px;bottom:96px;color:var(--muted);font-size:11px}
.credit a{color:var(--muted)}

@media (max-width:760px){
  .brand{top:12px;left:12px;padding:8px 12px}
  .brand small{display:none}
  .panel{top:auto;left:12px;right:12px;bottom:92px;width:auto;height:42vh}
  .player{left:12px;right:12px;bottom:12px;height:68px;gap:10px;padding:0 12px}
  .volume{display:none}
  .crosshair{top:28%}
  .credit{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="globe" aria-label="Interactive globe of radio stations"></div>
<div class="crosshair" aria-hidden="true"></div>

<header class="brand">
  <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="15" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="16" cy="16" r="9" fill="none" stroke="var(--accent)" stroke-width="2" opacity=".6"/>
    <circle cx="16" cy="16" r="3.5" fill="var(--accent)"/>
  </svg>
  <div><h1>Radio Shack</h1><small>Live radio from every corner of the planet</small></div>
</header>

<aside class="panel" aria-label="Stations">
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search stations, cities, genres" autocomplete="off" aria-label="Search stations">
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-here" aria-selected="true">Here</button>
    <button class="tab" role="tab" id="tab-favs" aria-selected="false">Favorites</button>
  </div>
  <div class="list-head"><h2 id="list-title">Pick a spot</h2><p id="list-sub">Click a glowing dot on the globe</p></div>
  <ul class="list" id="list"></ul>
</aside>

<footer class="player" id="player">
  <button class="play" id="play" aria-label="Play" disabled>
    <svg id="ico-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
    <svg id="ico-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>
  </button>
  <div class="now">
    <div class="now-name" id="now-name">Nothing playing</div>
    <div class="now-meta"><span class="live">LIVE</span><span id="now-meta">Spin the globe to find a station</span></div>
  </div>
  <button class="icon-btn" id="fav" aria-label="Add to favorites" aria-pressed="false" disabled>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>
  </button>
  <label class="volume">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  </label>
</footer>

<div class="credit">Station data: <a href="https://www.radio-browser.info" target="_blank" rel="noopener">Radio Browser</a> (open, community-run)</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="loading" id="loading"><div><div class="spinner"></div><p id="loading-text">Tuning in to the world...</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.2/dist/globe.gl.min.js"></script>
<script>
(() => {
  const API_HOSTS = ['de1', 'fi1', 'at1', 'nl1', 'de2'].map(h => `https://${h}.api.radio-browser.info`);
  const EARTH_IMG = 'https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/earth-dark.jpg';
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const ACCENT = css('--accent'), HIGHLIGHT = css('--highlight');

  const $ = id => document.getElementById(id);
  const audio = new Audio();
  audio.preload = 'none';
  audio.volume = 0.8;

  let apiHost = null, stations = [], places = [], byId = new Map();
  let selectedPlace = null, current = null, tab = 'here';

  // ---------- storage (best effort) ----------
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  let favs = store.get('rs-favs', []);
  audio.volume = store.get('rs-vol', 0.8);
  $('vol').value = audio.volume;

  // ---------- helpers ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const clean = s => String(s ?? '').trim().replace(/\s+/g, ' ');
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  async function api(path) {
    const hosts = apiHost ? [apiHost, ...API_HOSTS.filter(h => h !== apiHost)] : API_HOSTS;
    for (const h of hosts) {
      try {
        const r = await fetch(h + path, { headers: { Accept: 'application/json' } });
        if (r.ok) { apiHost = h; return r.json(); }
      } catch {}
    }
    throw new Error('Station directory unreachable');
  }

  function dist(aLat, aLng, bLat, bLng) {
    const r = Math.PI / 180;
    const dLat = (bLat - aLat) * r, dLng = (bLng - aLng) * r;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLng / 2) ** 2;
    return 2 * Math.asin(Math.sqrt(x));
  }

  // ---------- data ----------
  // Many stations in the directory have no coordinates, so the globe only shows
  // the popular geotagged ones up front; whole countries and search results are
  // pulled in on demand and merged in here.
  const groups = new Map(), seen = new Set(), countryLoads = new Map();
  const loc = st => st.place ? st.place.label : [st.state, st.country].filter(Boolean).join(', ') || 'Unknown';

  function addStation(s) {
    if (byId.has(s.stationuuid)) return;
    const name = clean(s.name);
    if (!name || !s.url_resolved) return;
    const dedupe = name.toLowerCase() + '|' + s.countrycode;
    if (seen.has(dedupe)) return;
    seen.add(dedupe);
    const lat = s.geo_lat == null ? NaN : +s.geo_lat, lng = s.geo_long == null ? NaN : +s.geo_long;
    const hasGeo = isFinite(lat) && isFinite(lng) && !(lat === 0 && lng === 0);
    const st = {
      id: s.stationuuid, name, url: s.url_resolved, favicon: s.favicon,
      country: clean(s.country), cc: s.countrycode, state: clean(s.state),
      lat: hasGeo ? lat : null, lng: hasGeo ? lng : null, place: null,
      tags: clean(s.tags).split(',').filter(Boolean).slice(0, 3).join(', '),
      codec: s.codec, bitrate: s.bitrate
    };
    if (hasGeo) {
      const key = lat.toFixed(1) + ',' + lng.toFixed(1);
      if (!groups.has(key)) groups.set(key, { lat, lng, cc: st.cc, country: st.country, stations: [], label: [st.state, st.country].filter(Boolean).join(', ') || 'Unknown' });
      st.place = groups.get(key);
      st.place.stations.push(st);
    }
    stations.push(st);
    byId.set(st.id, st);
  }

  function refreshPoints() {
    places = [...groups.values()];
    if (globe) globe.pointsData(places);
  }

  async function loadStations() {
    const raw = await api('/json/stations/search?has_geo_info=true&hidebroken=true&order=clickcount&reverse=true&limit=6000');
    raw.forEach(addStation);
    refreshPoints();
  }

  function loadCountry(cc) {
    if (!cc) return Promise.resolve();
    if (!countryLoads.has(cc)) {
      countryLoads.set(cc, api(`/json/stations/bycountrycodeexact/${encodeURIComponent(cc)}?hidebroken=true&order=clickcount&reverse=true`)
        .then(list => { list.forEach(addStation); refreshPoints(); countryLoads.set(cc, 'done'); })
        .catch(() => { countryLoads.delete(cc); }));
    }
    return Promise.resolve(countryLoads.get(cc));
  }

  let searchSeq = 0;
  async function remoteSearch(q) {
    const seq = ++searchSeq;
    const opts = 'hidebroken=true&order=clickcount&reverse=true';
    const enc = encodeURIComponent(q);
    const results = await Promise.allSettled([
      api(`/json/stations/search?name=${enc}&${opts}&limit=100`),
      api(`/json/stations/search?country=${enc}&${opts}&limit=500`),
      api(`/json/stations/search?tag=${enc}&${opts}&limit=100`)
    ]);
    results.forEach(r => r.status === 'fulfilled' && r.value.forEach(addStation));
    refreshPoints();
    if (seq === searchSeq && $('q').value.trim().toLowerCase() === q.toLowerCase()) render(true);
  }

  // ---------- globe ----------
  let globe;
  function initGlobe() {
    globe = Globe()($('globe'))
      .backgroundColor('rgba(0,0,0,0)')
      .globeImageUrl(EARTH_IMG)
      .showAtmosphere(true)
      .atmosphereColor(ACCENT)
      .atmosphereAltitude(0.16)
      .pointsData(places)
      .pointLat('lat').pointLng('lng')
      .pointColor(p => p === selectedPlace ? HIGHLIGHT : ACCENT)
      .pointAltitude(p => 0.004 + Math.min(p.stations.length, 40) * 0.0012)
      .pointRadius(p => 0.14 + Math.min(p.stations.length, 30) * 0.006)
      .pointResolution(8)
      .pointLabel(p => `<div class="tip">${esc(p.label)}<br><span>${p.stations.length} station${p.stations.length > 1 ? 's' : ''}</span></div>`)
      .onPointClick(p => selectPlace(p, true))
      .onGlobeClick(({ lat, lng }) => selectPlace(nearest(lat, lng), true))
      .ringsData([])
      .ringColor(() => t => `rgba(245,184,74,${1 - t})`)
      .ringMaxRadius(3).ringPropagationSpeed(2).ringRepeatPeriod(1200);

    const c = globe.controls();
    c.autoRotate = true;
    c.autoRotateSpeed = 0.35;
    c.enableDamping = true;
    globe.renderer().domElement.addEventListener('pointerdown', () => { c.autoRotate = false; }, { once: true });
    globe.pointOfView({ lat: 20, lng: 10, altitude: 2.3 });

    const fit = () => globe.width(innerWidth).height(innerHeight);
    addEventListener('resize', fit);
    fit();
  }

  function nearest(lat, lng) {
    let best = null, bd = Infinity;
    for (const p of places) {
      const d = dist(lat, lng, p.lat, p.lng);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }

  function selectPlace(p, fly) {
    if (!p) return;
    selectedPlace = p;
    globe.pointColor(globe.pointColor()); // refresh colours
    globe.ringsData([p]);
    if (fly) globe.pointOfView({ lat: p.lat, lng: p.lng, altitude: Math.min(globe.pointOfView().altitude, 1.6) }, 900);
    globe.controls().autoRotate = false;
    $('q').value = '';
    setTab('here');
  }

  // ---------- list ----------
  function stationRow(st) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'station' + (current === st ? ' playing' : '');
    b.dataset.id = st.id;
    const initials = esc(st.name.replace(/[^\p{L}\p{N} ]/gu, '').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || 'FM');
    const meta = [loc(st), st.tags].filter(Boolean).join(' · ');
    b.innerHTML = `<span class="logo">${initials}</span><span class="st-text"><div class="st-name">${esc(st.name)}</div><div class="st-meta">${esc(meta)}</div></span>`;
    if (st.favicon && /^https:\/\//i.test(st.favicon)) {
      const img = new Image();
      img.alt = '';
      img.loading = 'lazy';
      img.referrerPolicy = 'no-referrer';
      img.onload = () => { const l = b.querySelector('.logo'); l.textContent = ''; l.appendChild(img); };
      img.src = st.favicon;
    }
    b.addEventListener('click', () => play(st));
    li.appendChild(b);
    return li;
  }

  function render(keepScroll) {
    const q = $('q').value.trim().toLowerCase();
    let items, title, sub, extra = [], extraTitle = '';
    if (q) {
      items = stations.filter(s => (s.name + ' ' + loc(s) + ' ' + s.country + ' ' + s.tags).toLowerCase().includes(q)).slice(0, 300);
      title = 'Search results';
      sub = `${items.length}${items.length === 300 ? '+' : ''} match${items.length === 1 ? '' : 'es'} for "${$('q').value.trim()}"`;
    } else if (tab === 'favs') {
      items = favs.map(id => byId.get(id)).filter(Boolean);
      title = 'Favorites';
      sub = items.length ? `${items.length} saved station${items.length > 1 ? 's' : ''}` : 'Star a station to keep it here';
    } else if (selectedPlace) {
      const p = selectedPlace;
      items = p.stations;
      extra = stations.filter(s => s.cc === p.cc && s.place !== p);
      extraTitle = `More from ${p.country || 'this country'}`;
      title = p.label;
      const loading = countryLoads.get(p.cc) !== 'done';
      if (loading) loadCountry(p.cc).then(() => { if (selectedPlace === p && tab === 'here' && !$('q').value) render(true); });
      sub = `${items.length} station${items.length > 1 ? 's' : ''} here` +
        (loading ? ` · loading the rest of ${p.country || 'the country'}...` : extra.length ? ` · ${extra.length} more across ${p.country}` : '');
    } else {
      items = [];
      title = 'Pick a spot';
      sub = 'Click a glowing dot on the globe, or search above';
    }
    $('list-title').textContent = title;
    $('list-sub').textContent = sub;
    const list = $('list');
    const scroll = list.scrollTop;
    list.replaceChildren();
    if (!items.length && (q || tab === 'favs')) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = q ? 'No stations match. Try a city, country or genre.' : 'No favorites yet.';
      list.appendChild(li);
      return;
    }
    const frag = document.createDocumentFragment();
    items.forEach(s => frag.appendChild(stationRow(s)));
    if (extra.length) {
      const h = document.createElement('li');
      h.className = 'section';
      h.textContent = extraTitle;
      frag.appendChild(h);
      extra.forEach(s => frag.appendChild(stationRow(s)));
    }
    list.appendChild(frag);
    list.scrollTop = keepScroll ? scroll : 0;
  }

  function setTab(t) {
    tab = t;
    $('tab-here').setAttribute('aria-selected', t === 'here');
    $('tab-favs').setAttribute('aria-selected', t === 'favs');
    render();
  }

  // ---------- player ----------
  function setPlaying(on) {
    $('ico-play').hidden = on;
    $('ico-pause').hidden = !on;
    $('play').setAttribute('aria-label', on ? 'Pause' : 'Play');
    $('player').classList.toggle('is-live', on);
  }

  function updateFavBtn() {
    const on = !!current && favs.includes(current.id);
    $('fav').setAttribute('aria-pressed', on);
    $('fav').setAttribute('aria-label', on ? 'Remove from favorites' : 'Add to favorites');
  }

  async function play(st) {
    current = st;
    $('now-name').textContent = st.name;
    $('now-meta').textContent = [loc(st), st.bitrate ? st.bitrate + ' kbps' : '', st.codec].filter(Boolean).join(' · ');
    $('play').disabled = false;
    $('fav').disabled = false;
    updateFavBtn();
    document.querySelectorAll('.station').forEach(el => el.classList.toggle('playing', el.dataset.id === st.id));
    document.title = `${st.name} - Radio Shack`;
    if (st.place) {
      selectedPlace = st.place;
      globe.ringsData([st.place]);
      globe.pointColor(globe.pointColor());
      globe.pointOfView({ lat: st.lat, lng: st.lng, altitude: Math.min(globe.pointOfView().altitude, 1.6) }, 900);
    }

    audio.src = st.url;
    $('now-meta').textContent = 'Connecting...';
    try {
      await audio.play();
      // Let the directory know this station got a listen (their recommended etiquette).
      if (apiHost) fetch(`${apiHost}/json/url/${st.id}`).catch(() => {});
    } catch (e) {
      if (current === st && e.name !== 'AbortError') {
        setPlaying(false);
        toast(`${st.name} isn't responding right now. Try another station.`);
      }
    }
  }

  audio.addEventListener('playing', () => {
    setPlaying(true);
    if (current) $('now-meta').textContent = [loc(current), current.bitrate ? current.bitrate + ' kbps' : '', current.codec].filter(Boolean).join(' · ');
  });
  audio.addEventListener('pause', () => setPlaying(false));
  audio.addEventListener('waiting', () => { if (current) $('now-meta').textContent = 'Buffering...'; });

  $('play').addEventListener('click', () => {
    if (!current) return;
    if (audio.paused) { audio.src = current.url; audio.play().catch(() => toast("Couldn't resume this station.")); }
    else { audio.pause(); audio.removeAttribute('src'); audio.load(); }
  });
  $('fav').addEventListener('click', () => {
    if (!current) return;
    favs = favs.includes(current.id) ? favs.filter(id => id !== current.id) : [current.id, ...favs];
    store.set('rs-favs', favs);
    updateFavBtn();
    if (tab === 'favs') render();
  });
  $('vol').addEventListener('input', e => { audio.volume = +e.target.value; store.set('rs-vol', audio.volume); });
  $('tab-here').addEventListener('click', () => { $('q').value = ''; setTab('here'); });
  $('tab-favs').addEventListener('click', () => { $('q').value = ''; setTab('favs'); });
  let qTimer;
  $('q').addEventListener('input', () => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      render();
      const q = $('q').value.trim();
      if (q.length >= 2) remoteSearch(q);
    }, 250);
  });
  addEventListener('keydown', e => {
    if (e.code === 'Space' && !/INPUT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); $('play').click(); }
  });

  // ---------- boot ----------
  (async () => {
    try {
      await loadStations();
      initGlobe();
      render();
      $('loading').classList.add('done');
    } catch (e) {
      $('loading-text').textContent = "Couldn't reach the station directory. Check your connection and refresh.";
      console.error(e);
    }
  })();
})();
</script>
</body>
</html>
